<script>
  /* Liens officiels des stores : à modifier ici si besoin */
  var APP_STORE_URL  = "https://apps.apple.com/ma/app/fixnow/id6761471898?l=fr-FR";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.houmane.fixnow";

  (function () {
    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    // Téléphone : on passe par la vitrine, qui ouvre ensuite le bon store. Ainsi, derrière le store
    // (feuille App Store, retour depuis Google Play, navigateur d'Instagram), c'est le site qui s'affiche.
    // Les paramètres UTM suivent : la vitrine les transmet à Google Play.
    // location.replace : le bouton « retour » ne ramène pas sur cette page vide.
    var p = new URLSearchParams(location.search);
    if (isAndroid || isIOS) {
      p.set("store", "1");
      location.replace("/?" + p.toString());
    } else {
      location.replace("/" + location.search + "#telecharger"); // ordinateur : vitrine avec les deux stores
    }
  })();
</script>
