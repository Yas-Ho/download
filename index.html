<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécharger FixNow</title>
    <script>
        window.onload = function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Liens officiels de tes stores
            const appStoreUrl = "https://apps.apple.com/ma/app/fixnow/id6761471898?l=fr-FR";
            const playStoreUrl = "https://play.google.com/store/apps/details?id=com.houmane.fixnow";
            const defaultUrl = "https://play.google.com/store/apps/details?id=com.houmane.fixnow"; // Lien de secours par défaut

            if (/android/i.test(userAgent)) {
                window.location.href = playStoreUrl;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = appStoreUrl;
            } else {
                window.location.href = appStoreUrl; // Par défaut pour le web/desktop, redirige vers l'App Store
            }
        };
    </script>
</head>
<body style="background: #000000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">
    <!-- Un spinner de chargement minimaliste pendant la redirection flash -->
    <div style="color: #ffffff; font-size: 18px; font-weight: 500; letter-spacing: 0.5px;">Redirection en cours...</div>
</body>
</html>
